name: Lint and Build

on:
  pull_request:
    branches:
      - master

jobs:
  LinterCheck:
    runs-on: uipath-ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e  # v2.8.0
      - uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e  # v1.4.6
        with:
          node-version: '10.x'
      - name: Linter
        run: |
          yarn
          yarn lint

  FormattingCheck:
    runs-on: uipath-ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e  # v2.8.0
      - uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e  # v1.4.6
        with:
          node-version: '10.x'
      - name: Formatting Check
        run: |
          yarn
          yarn format:check

  BuildCheck:
    runs-on: uipath-ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e  # v2.8.0
      - uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e  # v1.4.6
        with:
          node-version: '10.x'
      - name: Build Status
        run: |
          yarn
          yarn build
